name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.4.10

      - run: bun install --frozen-lockfile

      - name: Check
        run: |
          biome check .
          bun x tsgo -p packages/github-issues/tsconfig.json
          bun x tsgo -p packages/support-workflow/tsconfig.json
          bun x tsgo -p packages/support-ui/tsconfig.json

      - name: Test
        run: bun run test
